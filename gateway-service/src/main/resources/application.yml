server:
  port: 8082

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: inventory-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/inventory/**

        - id: sales-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/sales/**

        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/notification/**