# Server configuration for the Gateway Service
server:
  port: 8082

spring:
  application:
    name: gateway-service

  # Spring Cloud Gateway routing configuration
  cloud:
    gateway:
      routes:

        # Route requests starting with /api/auth/ to the Auth Service
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        # Route requests starting with /api/inventory/ to the Inventory Service
        - id: inventory-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/inventory/**

        # Route requests starting with /api/sales/ to the Sales Service
        - id: sales-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/sales/**

        # Route requests starting with /api/notification/ to the Notification Service
        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/notification/**