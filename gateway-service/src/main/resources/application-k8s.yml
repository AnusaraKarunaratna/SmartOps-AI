# Gateway Service - Kubernetes Configuration
server:
  port: 8082

spring:
  application:
    name: gateway-service

  # Spring Cloud Gateway routing configuration for Kubernetes
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**

        - id: inventory-service
          uri: http://inventory-service:8083
          predicates:
            - Path=/api/inventory/**

        - id: sales-service
          uri: http://sales-service:8085
          predicates:
            - Path=/api/sales/**

        - id: notification-service
          uri: http://notification-service:8084
          predicates:
            - Path=/api/notification/**

        - id: analytics-service
          uri: http://analytics-service:8086
          predicates:
            - Path=/api/analytics/**

        - id: ai-service
          uri: http://ai-prediction-service:8090
          predicates:
            - Path=/api/ai/**

# Health check
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
