server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sales_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
  # Kafka configuration - allow failure if not available
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

logging:
  level:
    org.springframework.kafka: WARN
