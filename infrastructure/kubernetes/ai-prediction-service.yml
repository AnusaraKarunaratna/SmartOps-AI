apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-prediction-service
  namespace: smartops
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-prediction-service
  template:
    metadata:
      labels:
        app: ai-prediction-service
    spec:
      containers:
      - name: ai-prediction-service
        image: ai-prediction-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8090
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /docs
            port: 8090
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /docs
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: ai-prediction-service
  namespace: smartops
spec:
  selector:
    app: ai-prediction-service
  ports:
  - protocol: TCP
    port: 8090
    targetPort: 8090
  type: ClusterIP
