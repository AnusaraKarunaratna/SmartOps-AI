# Auth Service - Docker Configuration
server:
  port: 8081

spring:
  application:
    name: auth-service

  # Database connectivity for Docker environment
  datasource:
    url: jdbc:postgresql://postgres:5432/auth_service_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # JPA and Hibernate ORM settings
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Custom application properties for JWT handling
jwt:
  secret: ${JWT_SECRET:smartops-secret-key-123456smartops-secret-key-123456}
  expiration: ${JWT_EXPIRATION:86400000}
