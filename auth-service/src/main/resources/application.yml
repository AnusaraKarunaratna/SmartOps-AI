# Server configuration for the microservice
server:
  port: 8081

spring:
  application:
    name: auth-service

  # Database connectivity configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_service_db # URL to the PostgreSQL instance
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # JPA and Hibernate ORM settings
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Custom application properties for JWT handling
jwt:
  secret: smartops-secret-key-123456smartops-secret-key-123456
  expiration: 86400000