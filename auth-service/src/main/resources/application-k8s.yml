# Auth Service - Kubernetes Configuration
server:
  port: 8081

spring:
  application:
    name: auth-service

  # Database connectivity for Kubernetes
  datasource:
    url: jdbc:postgresql://postgres-service:5432/auth_service_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  # JPA and Hibernate ORM settings
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# JWT configuration
jwt:
  secret: ${JWT_SECRET:smartops-secret-key-123456smartops-secret-key-123456}
  expiration: ${JWT_EXPIRATION:86400000}

# Health check
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
