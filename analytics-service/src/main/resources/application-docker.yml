server:
  port: 8086

spring:
  application:
    name: analytics-service

  datasource:
    url: jdbc:postgresql://postgres:5432/analytics_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  kafka:
    bootstrap-servers: kafka:9092